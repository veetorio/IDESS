services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data:
