services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no arquivo passado com --env-file}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo passado com --env-file}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo passado com --env-file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo passado com --env-file}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo passado com --env-file}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo passado com --env-file}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo passado com --env-file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no arquivo passado com --env-file}
      SOCIAL_LOGIN_ENABLED: ${SOCIAL_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v26.0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      NEWSLETTER_EMAIL_ENABLED: ${NEWSLETTER_EMAIL_ENABLED:-false}
      NEWSLETTER_EMAIL_FROM: ${NEWSLETTER_EMAIL_FROM:-}
      NEWSLETTER_SMTP_HOST: ${NEWSLETTER_SMTP_HOST:-}
      NEWSLETTER_SMTP_PORT: ${NEWSLETTER_SMTP_PORT:-587}
      NEWSLETTER_SMTP_USERNAME: ${NEWSLETTER_SMTP_USERNAME:-}
      NEWSLETTER_SMTP_PASSWORD: ${NEWSLETTER_SMTP_PASSWORD:-}
      NEWSLETTER_SMTP_AUTH: ${NEWSLETTER_SMTP_AUTH:-true}
      NEWSLETTER_SMTP_STARTTLS: ${NEWSLETTER_SMTP_STARTTLS:-true}
      SANTANDER_ENABLED: ${SANTANDER_ENABLED:-false}
      SANTANDER_ENVIRONMENT: ${SANTANDER_ENVIRONMENT:-sandbox}
      SANTANDER_API_BASE_URL: ${SANTANDER_API_BASE_URL:-}
      SANTANDER_CLIENT_ID: ${SANTANDER_CLIENT_ID:-}
      SANTANDER_CLIENT_SECRET: ${SANTANDER_CLIENT_SECRET:-}
      SANTANDER_CERTIFICATE_PATH: ${SANTANDER_CERTIFICATE_PATH:-}
      SANTANDER_PRIVATE_KEY_PATH: ${SANTANDER_PRIVATE_KEY_PATH:-}
      SANTANDER_PIX_KEY: ${SANTANDER_PIX_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - evento_imagens:/app/uploads
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data:
  evento_imagens:
