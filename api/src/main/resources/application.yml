spring:
  application:
    name: instituto-ettore-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:institutoettore}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# JWT
jwt:
  secret: ${JWT_SECRET:dev-secret-mude-em-producao-com-256-bits-minimo}
  expiration-ms: 604800000       # 7 dias em milissegundos

# CORS — origins permitidas
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nome: ${ADMIN_NAME:Administrador}
    telefone: ${ADMIN_PHONE:}

logging:
  level:
    br.org.institutoettore: DEBUG
    org.springframework.security: INFO
